[workspace]
resolver = "2"
members = [
    "crates/donkai-node",
    "crates/donkai-lps1",
    "crates/donkai-identity",
    "crates/donkai-evidence",
    "crates/donkai-corroboration",
    "crates/donkai-translation",
    "crates/donkai-review",
    "crates/donkai-ipfs",
]
default-members = ["crates/donkai-node", "crates/donkai-lps1"]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.80"
authors      = ["DONK AI Core Protocol <dev@donkai.org>"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/FTHTrading/Donkai---1977"

[workspace.dependencies]
sha2            = "0.10"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
hex             = "0.4"
data-encoding   = "2.6"
thiserror       = "1"
reqwest         = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }

# Protocol crates
donkai-lps1          = { path = "crates/donkai-lps1" }
donkai-identity      = { path = "crates/donkai-identity" }
donkai-evidence      = { path = "crates/donkai-evidence" }
donkai-corroboration = { path = "crates/donkai-corroboration" }
donkai-translation   = { path = "crates/donkai-translation" }
donkai-review        = { path = "crates/donkai-review" }
donkai-ipfs          = { path = "crates/donkai-ipfs" }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = true
panic         = "abort"

[profile.dev]
opt-level       = 0
debug           = true
overflow-checks = true
