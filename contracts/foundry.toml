[profile.default]
src            = "src"
out            = "out"
libs           = ["lib"]
test           = "test"
script         = "script"
solc           = "0.8.24"
evm_version    = "cancun"
optimizer      = true
optimizer_runs = 200
via_ir         = true
gas_reports    = ["DonkaiTimelineRegistry", "DonkaiFormatWar", "DonkaiAnchorMirror"]
fs_permissions = [{ access = "read", path = "./out" }]

[fuzz]
runs              = 1024
max_test_rejects  = 65536

[invariant]
runs           = 256
depth          = 128
fail_on_revert = false

[rpc_endpoints]
donkai_devnet   = "${DONKAI_DEVNET_RPC}"
polygon_mainnet = "${POLYGON_MAINNET_RPC}"

[etherscan]
polygon = { key = "${POLYGONSCAN_API_KEY}", chain = 137 }
